<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PLATFORM Core · Demo Pack</title>
  <style>
    :root { color-scheme: light dark; font: 16px/1.5 system-ui, sans-serif; }
    body { max-width: 760px; margin: 3rem auto; padding: 0 1rem; }
    .card { border: 1px solid #8886; border-radius: 12px; padding: 1.25rem; margin-top: 1rem; }
    button { border: 0; border-radius: 8px; padding: .6rem .9rem; cursor: pointer; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    .muted { opacity: .75; }
    .pack-badge { display: inline-flex; vertical-align: middle; padding: .1rem .55rem; border: 1px solid #8886; border-radius: 999px; font-size: .8rem; }
  </style>
</head>
<body>
  <h1>PLATFORM Core <span id="pack-badge" class="pack-badge">demo</span></h1>
  <p class="muted">离线样例：只使用 mock transport，不需要业务凭据、业务主机或数据库。</p>
  <button id="reload" type="button">重新读取目录</button>
  <main id="cases" aria-live="polite"></main>
  <pre id="result" class="card">选择只读样例以查看结果。</pre>
  <script>
    const casesRoot = document.querySelector('#cases');
    const result = document.querySelector('#result');
    async function loadCatalog() {
      casesRoot.replaceChildren();
      const response = await fetch('/api/catalog?lite=1', {cache: 'no-store'});
      const payload = await response.json();
      if (!response.ok || !payload.ok) throw new Error(payload.error || 'catalog request failed');
      const packs = payload.data.packs || [];
      document.querySelector('#pack-badge').textContent = packs.length
        ? packs.map(pack => pack.name).join(' · ')
        : '未选择 pack';
      for (const item of payload.data.cases || []) {
        const card = document.createElement('section');
        card.className = 'card';
        const title = document.createElement('h2');
        title.textContent = `${item.id} · ${item.desc}`;
        const expected = document.createElement('p');
        expected.textContent = item.expected || '';
        const run = document.createElement('button');
        run.type = 'button';
        run.textContent = '运行只读样例';
        run.addEventListener('click', async () => {
          result.textContent = '运行中…';
          try {
            const reply = await fetch('/api/run-case', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({id: item.id}),
            });
            result.textContent = JSON.stringify(await reply.json(), null, 2);
          } catch (error) {
            result.textContent = String(error);
          }
        });
        card.append(title, expected, run);
        casesRoot.append(card);
      }
      if (!payload.data.cases?.length) casesRoot.textContent = '当前 pack 没有只读样例。';
    }
    document.querySelector('#reload').addEventListener('click', () => {
      loadCatalog().catch(error => { result.textContent = String(error); });
    });
    loadCatalog().catch(error => { result.textContent = String(error); });
  </script>
</body>
</html>
