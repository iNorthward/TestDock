<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>测试平台 · 测试工作台</title>
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<script src="/assets/theme-boot.js"></script>
<link rel="stylesheet" href="/assets/theme-bundle.css">
<link rel="stylesheet" href="/assets/platform-panel.css">
<script src="/assets/theme-switcher.js" defer></script>
<script src="/assets/execution-client.js"></script>
</head>
<body>
<div class="app-shell">
<aside class="sidebar" aria-label="工作台导航">
<a class="brand" href="/"><img src="/assets/icons/favicon.svg" alt=""><div><strong>测试平台</strong><small>Testing workspace</small></div></a>
<div class="nav-label">Workspace</div>
<nav>
<button class="nav-item active" id="nav-cases" type="button"><span class="nav-icon" aria-hidden="true">▦</span>用例工作台</button>
<button class="nav-item" id="nav-resources" type="button" hidden><span class="nav-icon" aria-hidden="true">◇</span><span id="resource-nav-label">项目资源</span></button>
<a class="nav-item" href="/insights?tab=history"><span class="nav-icon" aria-hidden="true">◷</span>运行历史</a>
<a class="nav-item" href="/insights"><span class="nav-icon" aria-hidden="true">⌘</span>平台诊断</a>
</nav>
<div class="sidebar-footer"><div class="project-card"><small>当前项目</small><div class="project-name"><span class="dot"></span><span id="pack-badge">加载中</span></div></div></div>
</aside>
<div class="workspace">
<header class="topbar"><div class="breadcrumb">工作台<span id="breadcrumb-current">用例目录</span></div><div class="topbar-tools"><span class="workspace-label"><span class="dot"></span>本地工作区</span><div data-theme-picker></div></div></header>
<main class="content">
<div class="eyebrow">Test operations</div>
<div class="page-heading"><div><h1 id="page-title">用例工作台</h1><p class="subtitle" id="page-description">查看项目用例，让每一次执行都有迹可循。</p></div><button class="btn" id="reload" type="button">↻ 刷新目录</button></div>
<section id="case-view">
<div class="stats" role="group" aria-label="用例概览">
<div class="stat"><div class="stat-label">项目用例</div><div class="stat-value" id="total-cases">—</div><div class="stat-note">来自当前项目的用例目录</div></div>
<div class="stat"><div class="stat-label">只读 / SAFE</div><div class="stat-value" id="safe-cases">—</div><div class="stat-note">可从工作台发起执行</div></div>
<div class="stat"><div class="stat-label">测试套件</div><div class="stat-value" id="total-suites">—</div><div class="stat-note">按项目定义组织测试</div></div>
</div>
<section class="panel" aria-labelledby="catalog-title"><div class="panel-header"><div><div class="panel-title" id="catalog-title">用例目录</div><div class="panel-subtitle">选择用例执行，结果会显示在下方。</div></div><label class="search"><span aria-hidden="true">⌕</span><input id="filter" type="search" placeholder="搜索 ID、名称或分组" aria-label="筛选用例"></label></div><div class="table-label" aria-hidden="true"><span>用例 ID</span><span>测试内容</span><span>执行模式</span><span>操作</span></div><div id="cases" aria-live="polite"></div></section>
<section class="panel result-panel" aria-labelledby="result-title"><div class="panel-header"><div class="panel-title" id="result-title">执行结果</div><div><button id="job-resume" class="btn small" type="button" hidden>恢复查询</button> <button id="job-cancel" class="btn small" type="button" hidden>取消任务</button> <span id="result-status" class="tag">等待执行</span></div></div><pre class="result-content" id="result" tabindex="0" aria-live="polite">选择一个 SAFE 用例，执行结果将在这里显示。</pre></section>
</section>
<section id="resource-view" class="panel" hidden><div class="panel-header"><div><div class="panel-title" id="resource-title">项目资源</div><div class="panel-subtitle" id="resource-description"></div></div><button id="identity-reload" class="btn small" type="button">刷新资源</button></div><div id="identity-categories" class="resources" aria-live="polite"></div><div id="resource-maintenance" class="maintenance"></div></section>
<div class="status-bar" id="status" role="status"><span id="status-text">正在加载工作区…</span><span>测试平台</span></div>
</main></div></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
let allCases = [], resourceDefinition = {enabled:false}, currentView = 'cases', activeRun=null, packId='', watching=false;
const setText = (id, value) => { $(id).textContent = value; };
async function api(path, options) { const reply=await fetch(path, options); const payload=await reply.json(); if (!reply.ok || !payload.ok) throw new Error(payload.error || '请求失败'); return payload.data; }
function showStatus(text, error=false){setText('status-text',text);$('status').classList.toggle('error',error);}
function view(name) {
 if(name==='resources' && !resourceDefinition.enabled) return;
 currentView=name;$('case-view').hidden=name!=='cases';$('resource-view').hidden=name!=='resources';
 $('nav-cases').classList.toggle('active',name==='cases');$('nav-resources').classList.toggle('active',name==='resources');
 setText('page-title',name==='cases'?'用例工作台':resourceDefinition.title);
 setText('breadcrumb-current',name==='cases'?'用例目录':resourceDefinition.title);
 setText('page-description',name==='cases'?'查看项目用例，让每一次执行都有迹可循。':resourceDefinition.description);
 if(name==='resources') loadResources();
}
function renderCases(){
 const root=$('cases'),needle=$('filter').value.trim().toLowerCase();root.replaceChildren();
 const visible=allCases.filter(c=>[c.id,c.desc,c.group,c.suite,c.expected,c.regressionNote].some(v=>String(v||'').toLowerCase().includes(needle)));
 for(const item of visible){
  const row=document.createElement('article');row.className='case-row';
  const id=document.createElement('div');id.className='case-id';id.textContent=item.id;
  const info=document.createElement('div');info.className='case-info';const name=document.createElement('div');name.className='case-name';name.textContent=item.desc;
  const desc=document.createElement('div');desc.className='case-description';desc.textContent=item.expected||item.suite||'';info.append(name,desc);
  if(item.regressionNote){const note=document.createElement('div');note.className='case-description';note.textContent=item.regressionNote;info.append(note);}
  const mode=document.createElement('div'),tag=document.createElement('span');tag.className='tag '+(item.mode==='live'?'live':'safe');tag.textContent=(item.mode||'safe').toUpperCase();mode.append(tag);
  const run=document.createElement('button');run.className='btn small primary';run.type='button';run.textContent=item.regressionExcluded?'本轮排除':item.mode==='live'?'受控执行':'运行用例';run.disabled=Boolean(activeRun)||watching||item.mode==='live'||Boolean(item.regressionExcluded);run.addEventListener('click',()=>runCase(item,run));
  row.append(id,info,mode,run);root.append(row);
 }
 if(!visible.length){const empty=document.createElement('div');empty.className='empty-state';empty.textContent=needle?'没有匹配的用例，请调整搜索条件。':'当前项目还没有测试用例。';root.append(empty);}
}
async function loadCatalog(){
 try{const data=await api('/api/catalog?lite=1',{cache:'no-store'});allCases=data.cases||[];
 setText('pack-badge',(data.packs||[]).map(p=>p.name).join(' · ')||'未选择项目');
 setText('total-cases',allCases.length);setText('safe-cases',allCases.filter(c=>c.mode!=='live'&&!c.regressionExcluded).length);setText('total-suites',new Set(allCases.map(c=>c.suite)).size);renderCases();showStatus('目录已更新 · '+allCases.length+' 个用例');
 }catch(e){showStatus(e.message,true);}
}
async function loadCapabilities(){
 try{const data=await api('/api/platform');packId=data.pack;restoreActiveJob();resourceDefinition=data.resourcePool||{enabled:false};$('nav-resources').hidden=!resourceDefinition.enabled;setText('resource-nav-label',resourceDefinition.title||'项目资源');setText('resource-title',resourceDefinition.title||'项目资源');setText('resource-description',resourceDefinition.description||'');if(!resourceDefinition.enabled)view('cases');}
 catch(e){showStatus('项目能力读取失败：'+e.message,true);}
}
async function loadResources(){
 if(!resourceDefinition.enabled)return;
 const root=$('identity-categories');root.replaceChildren();$('resource-maintenance').replaceChildren();
 try{const data=await api('/api/identity-pool',{cache:'no-store'});if(!data.enabled){resourceDefinition.enabled=false;$('nav-resources').hidden=true;view('cases');return;}
 for(const [key,item] of Object.entries(data.categories||{})){
  const card=document.createElement('section');card.className='resource-card';const name=document.createElement('strong');name.textContent=item.label||key;const count=document.createElement('div');count.className='resource-count';count.textContent=item.count||0;const note=document.createElement('div');note.className='muted';note.textContent=(item.missing||[]).length?'缺少：'+item.missing.join('、'):'已声明的资源需求无缺项';card.append(name,count,note);root.append(card);
 }
 if(!root.children.length){const empty=document.createElement('div');empty.className='empty-state';empty.textContent='当前项目未声明资源分类。';root.append(empty);}
 const findings=data.maintenance?.findings||[];if(findings.length){const title=document.createElement('strong');title.textContent='维护建议';const list=document.createElement('ul');for(const item of findings){const li=document.createElement('li');li.textContent=(item.title||item.name||item.role||'资源')+'：'+(item.suggestion||'需要核实');list.append(li);}$('resource-maintenance').append(title,list);}
 }catch(e){const empty=document.createElement('div');empty.className='empty-state';empty.textContent='资源暂不可用：'+e.message;root.append(empty);}
}
function activeStorageKey(){return 'platform.activeReadonlyJob.'+packId;}
function saveActiveJob(){try{if(activeRun)sessionStorage.setItem(activeStorageKey(),JSON.stringify(activeRun));else sessionStorage.removeItem(activeStorageKey());}catch(_) {}}
function restoreActiveJob(){
 if(activeRun||!packId)return;
 try{const saved=JSON.parse(sessionStorage.getItem(activeStorageKey())||'null');if(saved&&typeof saved.jobId==='string'&&typeof saved.caseId==='string'){activeRun=saved;$('job-resume').hidden=false;$('job-cancel').hidden=false;setText('result-status','待恢复查询');setText('result','发现未确认终态的任务，请恢复查询。任务 '+saved.jobId);renderCases();}}catch(_) {}
}
async function watchActiveJob(){
 if(!activeRun||watching)return;watching=true;$('job-resume').hidden=true;$('job-cancel').hidden=false;renderCases();
 const current=activeRun;
 try{
  const job=await PLATFORMExecution.pollJob(fetch,'/api/execution/job?id='+encodeURIComponent(current.jobId),{onProgress:j=>setText('result-status',j.status)});
  const data=job.result||{ok:null,status:job.status,error:job.error};
  setText('result-status',data.status==='passed'?'通过':data.executionStatus||data.status||job.status);setText('result',JSON.stringify(data,null,2));showStatus('执行已结束 · '+current.caseId);
  await fetch.completeRequest?.('/api/run-case',{id:current.caseId,background:true});
  activeRun=null;saveActiveJob();$('job-cancel').hidden=true;
 }catch(error){setText('result-status','查询未完成');setText('result',error.message+' · 任务 '+current.jobId);showStatus(error.message,true);$('job-resume').hidden=false;}
 finally{watching=false;renderCases();}
}
async function runCase(item,button){
 if(activeRun||watching)return;button.disabled=true;watching=true;renderCases();setText('result-status','提交中');setText('result','正在提交 '+item.id+'…');
 try{
  const data=await api('/api/run-case',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:item.id,background:true})});
  activeRun={jobId:data.executionId,caseId:item.id};saveActiveJob();watching=false;await watchActiveJob();
 }catch(error){watching=false;setText('result-status','提交结果未确认');setText('result',error.message);showStatus(error.message,true);renderCases();}
}
$('job-resume').addEventListener('click',watchActiveJob);
$('job-cancel').addEventListener('click',async()=>{
 if(!activeRun)return;$('job-cancel').disabled=true;
 try{const job=await api('/api/execution/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:activeRun.jobId})});setText('result-status',job.status);if(!watching)await watchActiveJob();}
 catch(error){showStatus(error.message,true);}finally{$('job-cancel').disabled=false;}
});
$('nav-cases').addEventListener('click',()=>view('cases'));$('nav-resources').addEventListener('click',()=>view('resources'));$('filter').addEventListener('input',renderCases);$('reload').addEventListener('click',()=>{loadCatalog();loadCapabilities();if(currentView==='resources')loadResources();});$('identity-reload').addEventListener('click',loadResources);loadCapabilities();loadCatalog();
</script>
</body></html>
