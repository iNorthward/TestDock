<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI 场景选型 · TestDock</title>
<link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
<script src="/assets/theme-boot.js"></script>
<link rel="stylesheet" href="/assets/theme-bundle.css">
<link rel="stylesheet" href="/assets/platform-panel.css">
<link rel="stylesheet" href="/assets/reference-workspace.css">
<link rel="stylesheet" href="/assets/workspace-shell.css">
<link rel="stylesheet" href="/assets/workbench-components.css">
<link rel="stylesheet" href="/assets/ui-scenes.css">
<script src="/assets/theme-switcher.js" defer></script>
<script src="/assets/workspace-shell.js" defer></script>
<script src="/assets/workbench-components.js" defer></script>
<script src="/assets/ui-scenes.js" defer></script>
</head>
<body class="scenes-workspace" data-workspace-title="UI 场景选型">
<div class="app-shell">
<aside class="sidebar" aria-label="工作台导航">
  <a class="brand" href="/#/home"><img src="/assets/icons/favicon.svg" alt=""><div><strong>TestDock</strong><small>测试验收平台</small></div></a>
  <a class="nav-item active" href="/ui-scenes" aria-current="page">UI 场景选型</a>
</aside>
<div class="workspace">
<header class="topbar">
  <div class="workspace-bar-label">已打开</div><div id="workspace-tabs" class="workspace-tabs"></div>
  <div class="topbar-tools"><div data-theme-picker></div></div>
</header>
<main class="content scenes-page" id="ui-scenes">
  <header class="scenes-heading">
    <div><h1>UI 场景选型</h1><p>为新页面或现有功能选择交互方案，查看可复用组件、Pack 需补的内容与验收步骤。</p></div>
    <a class="btn scenes-action" href="/ui-scenes/demo">体验完整示范 →</a>
  </header>

  <section class="scenes-panel scenes-filter" aria-label="筛选 UI 场景">
    <div class="scenes-field">
      <label for="scene-page-type">页面类型</label>
      <select id="scene-page-type" disabled><option value="">全部页面</option></select>
    </div>
    <div class="scenes-field">
      <label for="scene-search">搜索场景</label>
      <input id="scene-search" type="search" maxlength="120" placeholder="如：E10、复核、createDetailsDialog" disabled>
    </div>
    <button class="btn" id="scene-clear" type="button" disabled>清除筛选</button>
    <p id="scene-page-description"></p>
    <p id="scene-page-components" hidden><strong>页面建议组件</strong> <span></span> <a href="/docs/guides/工作台交互组件.md">查看组件用法</a></p>
  </section>

  <div class="scenes-section-heading">
    <h2>可用场景</h2>
    <p id="scene-status" role="status">正在读取场景规范…</p>
    <button class="btn" id="scene-retry" type="button" hidden>重试加载</button>
  </div>
  <div class="scenes-results" id="scene-results" hidden>
    <ul class="scenes-panel scenes-list" id="scene-list" aria-label="场景列表"></ul>
    <article class="scenes-panel scenes-detail" id="scene-detail" aria-labelledby="scene-title">
      <header><p class="scenes-meta" id="scene-meta"></p><h3 id="scene-title" tabindex="-1"></h3></header>
      <dl class="scenes-facts" id="scene-facts"></dl>
      <footer class="scenes-actions">
        <button class="btn" id="scene-copy" type="button">复制本条选型</button>
        <a class="btn" id="scene-guide">阅读统一规范</a>
      </footer>
      <p class="wb-feedback" id="scene-copy-status" hidden></p>
    </article>
  </div>
</main>
</div></div>
</body>
</html>
